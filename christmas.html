<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050916">
<title>Christmas Night · Grand Fireworks</title>
<meta name="description" content="A colorful animated fireworks show of code, stars, skyline and river reflections.">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 24%,#17283b,#060d1b 70%);color:#f4e6da;font-family:system-ui,sans-serif}
.page{max-width:1100px;min-height:100svh;margin:auto;padding:18px clamp(9px,3vw,36px) 30px;display:flex;align-items:center;flex-direction:column}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;font:11px ui-monospace,Consolas,monospace;letter-spacing:.1em;color:#a3b6c6}
a{color:#c4d9e9;text-decoration:none}a:hover{text-decoration:underline}
h1{font:400 clamp(32px,5.5vw,62px)/1.15 Georgia,serif;letter-spacing:-.03em;text-align:center;margin:20px 0 8px}
.subtitle{font:10px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.16em;text-align:center;color:#a1b6c6;margin:0 0 17px}
.terminal{width:min(100%,950px);border:1px solid #334657;border-radius:12px;background:#030715;overflow:hidden;box-shadow:0 25px 90px #000a,0 0 55px #40709715}
.bar{height:35px;background:#111d2c;border-bottom:1px solid #2d3c50;display:flex;gap:7px;align-items:center;padding:0 13px}
.dot{width:9px;height:9px;border-radius:50%;background:#d97075}.dot:nth-child(2){background:#d7b26e}.dot:nth-child(3){background:#88bba3}
.filename{margin:auto;transform:translateX(-17px);color:#95a4b2;font:10px ui-monospace,Consolas,monospace}
.stage{position:relative;overflow:hidden}canvas{display:block;width:100%;height:auto;aspect-ratio:12/8}
.hint{position:absolute;bottom:13px;left:16px;color:#83a1b6;font:10px ui-monospace,Consolas,monospace;pointer-events:none}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:19px 0}
button{min-width:152px;border:1px solid #69819a;background:#0e1b2a;color:#f0e6d9;border-radius:3px;font:11px ui-monospace,Consolas,monospace;letter-spacing:.08em;padding:12px 17px;cursor:pointer}
button:hover,button:focus-visible{background:#20384f;border-color:#dfd0bc}
a:focus-visible,button:focus-visible{outline:2px solid #f5d98c;outline-offset:3px}
.message{color:#bdcbd4;text-align:center;font-size:13px;line-height:1.9;word-break:keep-all}
footer{margin-top:auto;padding-top:23px;text-align:center;font:10px/1.7 ui-monospace,Consolas,monospace;color:#8094a5}
@media(max-width:500px){nav{font-size:9px;letter-spacing:.04em}.page{padding:16px 8px 24px}.hint{font-size:8px}}
</style></head>
<body><div class="page">
<nav><a href="./?v=20261116-3">← CARD HOME</a><span><a href="./tree.html?v=20261116-3">TREE ↗</a> · <a href="./christmas.html" aria-current="page">FIREWORKS</a></span></nav>
<h1>Let the night sparkle ✧</h1>
<p class="subtitle">A GRAND CHRISTMAS FIREWORK SHOW OVER THE RIVER</p>
<section class="terminal" aria-label="다채로운 불꽃과 강물 반사 애니메이션">
<div class="bar" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="filename">christmas_fireworks.js</span></div>
<div class="stage"><canvas id="sky" width="1200" height="800" role="img" aria-label="밤하늘의 대형 컬러 불꽃놀이와 도시 야경, 강물 위의 빛 반사"></canvas><span class="hint">✦ AN ORIGINAL CODE-LIGHT SHOW</span></div>
</section>
<div class="actions"><button id="more" type="button">✦ GRAND FINALE</button><button id="pause" type="button">Ⅱ PAUSE</button></div>
<p class="message">하늘 가득 피어나는 빛처럼,<br>올겨울에도 아름다운 순간들이 가득하길. 메리 크리스마스! 🎄</p>
<footer>MADE OF STARS & CODE · 2026</footer>
</div>
<script>
(function(){
"use strict";
const canvas=document.getElementById("sky"),ctx=canvas.getContext("2d",{alpha:false});
const W=1200,H=800,horizon=640;
const colors=["#ffe298","#ff7199","#6ef5db","#8cb7ff","#c69aff","#f9a46e","#a6f5a7"];
const rand=(a,b)=>a+Math.random()*(b-a);
const stars=Array.from({length:180},()=>({x:rand(0,W),y:rand(0,horizon-70),r:rand(.4,1.6),phase:rand(0,6)}));
const snow=Array.from({length:90},()=>({x:rand(0,W),y:rand(0,H),vx:rand(-.2,.3),vy:rand(.15,.65),r:rand(.55,1.6)}));
let particles=[],rockets=[],flashes=[],time=0,finale=0;
let playing=!window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function light(x,y,r,color,alpha){
 ctx.save();ctx.globalAlpha=alpha;
 const g=ctx.createRadialGradient(x,y,0,x,y,r);
 g.addColorStop(0,color);g.addColorStop(1,"transparent");ctx.fillStyle=g;
 ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore();
}
function launch(x,targetY,color){
 rockets.push({x:x===undefined?rand(130,W-130):x,y:horizon+5,
   tx:rand(-35,35),vy:rand(-10.5,-8.5),target:targetY===undefined?rand(115,430):targetY,
   color:color||colors[Math.floor(rand(0,colors.length))],trail:[]});
}
function burst(x,y,color,scale){
 scale=scale||1;
 flashes.push({x,y,color,life:12*scale});
 const count=Math.floor(155*scale);
 for(let i=0;i<count;i++){
   const a=(i/count)*Math.PI*2+rand(-.04,.04);
   const ring=i%4===0;
   const speed=rand(1.5,4.4)*scale*(ring?1.15:1);
   const tint=i%9===0?"#fff5db":i%6===0?colors[Math.floor(rand(0,colors.length))]:color;
   particles.push({x,y,px:x,py:y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
    life:rand(45,90),max:90,color:tint,size:rand(1,2.7),drag:rand(.968,.981),grav:rand(.018,.040)});
 }
 // Smaller crackling core
 for(let i=0;i<40*scale;i++){
  const a=rand(0,Math.PI*2),speed=rand(.2,2.4);
  particles.push({x,y,px:x,py:y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
    life:rand(17,38),max:40,color:"#fff7d4",size:rand(1,2),drag:.96,grav:.028});
 }
}
function advance(){
 time++;
 if(finale>0)finale--;
 const interval=finale>0?9:38;
 if(time%interval===0)launch();
 if(time%101===0)launch();
 for(let i=rockets.length-1;i>=0;i--){
  const r=rockets[i];r.trail.push({x:r.x,y:r.y});if(r.trail.length>20)r.trail.shift();
  r.x+=r.tx*.025;r.y+=r.vy;r.vy+=.035;
  if(r.y<=r.target||r.vy>=0){burst(r.x,r.y,r.color,finale>0?rand(1,1.6):rand(.75,1.25));rockets.splice(i,1);}
 }
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vx*=p.drag;p.vy=p.vy*p.drag+p.grav;p.life--;
  if(p.life<=0||p.y>=horizon+15)particles.splice(i,1);
 }
 if(particles.length>3200)particles.splice(0,particles.length-3200);
 for(let i=flashes.length-1;i>=0;i--){if(--flashes[i].life<=0)flashes.splice(i,1);}
 for(const s of snow){s.x+=s.vx+Math.sin(time*.02+s.y)*.13;s.y+=s.vy;
  if(s.y>H){s.y=0;s.x=rand(0,W);}
 }
}
function drawCity(){
 // skyline, windows, bridge
 ctx.fillStyle="#0a1726";ctx.fillRect(0,horizon-60,W,64);
 for(let k=0;k<42;k++){
   const x=k*31-10,hh=35+((k*31+7)%90),ww=20+(k%3)*8;
   ctx.fillStyle=k%2?"#101e2d":"#142334";ctx.fillRect(x,horizon-hh,ww,hh);
   for(let wy=horizon-hh+10;wy<horizon-9;wy+=13)for(let wx=x+5;wx<x+ww-3;wx+=10){
    if((k+wx+wy)%4!==0){ctx.fillStyle="rgba(255,205,130,.45)";ctx.fillRect(wx,wy,2,3);}
   }
 }
 ctx.beginPath();ctx.moveTo(90,horizon-44);ctx.quadraticCurveTo(460,horizon-160,1110,horizon-44);
 ctx.strokeStyle="#7d8ea0";ctx.lineWidth=3;ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,horizon-30);ctx.lineTo(W,horizon-30);
 ctx.lineWidth=5;ctx.strokeStyle="#a4a6b8";ctx.stroke();
 for(let x=90;x<1140;x+=65){ctx.strokeStyle="#5e7387";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,horizon-33);ctx.lineTo(x,horizon-60-45*Math.sin(Math.PI*(x-90)/1050));ctx.stroke();}
}
function drawWater(){
 let water=ctx.createLinearGradient(0,horizon,0,H);
 water.addColorStop(0,"#10243a");water.addColorStop(1,"#050b1a");ctx.fillStyle=water;ctx.fillRect(0,horizon,W,H-horizon);
 const reflect=particles.filter(p=>p.y<horizon&&p.life>10);
 for(let y=horizon+5;y<H;y+=6){
  const z=(y-horizon)/(H-horizon);
  for(let i=0;i<19;i++){
    const x=(i*83+(Math.sin(y*.21+time*.03+i)*45)+W)%W;
    ctx.fillStyle="rgba(91,140,173,"+(0.035+.08*(1-z))+")";
    ctx.fillRect(x,y,rand(15,55)*z+5,1.5);
  }
 }
 for(let i=0;i<reflect.length;i+=3){
  const p=reflect[i],depth=(horizon-p.y)/horizon;
  const yy=horizon+depth*(H-horizon)*.75+rand(-2,2),xx=p.x+Math.sin(yy*.12+time*.04)*13;
  ctx.globalAlpha=Math.max(0,.13*(p.life/p.max));
  ctx.fillStyle=p.color;ctx.fillRect(xx-6,yy,rand(12,32),1.7);
 }
 ctx.globalAlpha=1;
}
function render(){
 ctx.fillStyle="#030817";ctx.fillRect(0,0,W,H);
 const bg=ctx.createRadialGradient(W/2,270,40,W/2,350,760);
 bg.addColorStop(0,"#162441");bg.addColorStop(.6,"#081224");bg.addColorStop(1,"#030817");
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,horizon);
 stars.forEach(s=>{ctx.globalAlpha=.25+.55*(.5+.5*Math.sin(time*.028+s.phase));ctx.fillStyle="#d7e7ff";
  ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
 // Colored blooms shine through the night sky
 flashes.forEach(f=>light(f.x,f.y,220,f.color,Math.min(.24,f.life*.014)));
 particles.forEach(p=>{
  const a=Math.max(0,Math.min(1,p.life/p.max));
  ctx.globalAlpha=a*.5;ctx.strokeStyle=p.color;ctx.lineWidth=p.size*.75;
  ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();
  ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
 });ctx.globalAlpha=1;
 rockets.forEach(r=>{
   for(let i=0;i<r.trail.length;i++){
     const p=r.trail[i];ctx.globalAlpha=i/r.trail.length*.7;ctx.fillStyle=r.color;
     ctx.fillRect(p.x,p.y,2.5,5);
   }
   ctx.globalAlpha=1;light(r.x,r.y,22,r.color,.6);ctx.fillStyle="#fff6d9";ctx.fillRect(r.x-1.5,r.y-4,3,9);
 });
 ctx.globalAlpha=1;
 drawCity();drawWater();
 snow.forEach(s=>{ctx.globalAlpha=.25;ctx.fillStyle="#d0e4f8";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
 ctx.globalAlpha=1;
 ctx.textAlign="center";ctx.font="600 29px Georgia,serif";ctx.shadowColor="#ffd9a9";ctx.shadowBlur=18;
 ctx.fillStyle="#fff0d8";ctx.fillText("MERRY CHRISTMAS",W/2,65);ctx.shadowBlur=0;
 ctx.font="13px Consolas,monospace";ctx.fillStyle="#7e9bab";ctx.textAlign="right";
 ctx.fillText(playing?"● LIVE / COLOR BURST":"Ⅱ PAUSED",W-20,H-21);
}
document.getElementById("more").addEventListener("click",()=>{
 finale=190;
 for(let i=0;i<6;i++)launch(rand(160,W-160),rand(130,380),colors[i%colors.length]);
});
const pause=document.getElementById("pause");
pause.addEventListener("click",()=>{playing=!playing;pause.textContent=playing?"Ⅱ PAUSE":"▶ PLAY";render();});
if(!playing)pause.textContent="▶ PLAY";
launch(450,270,colors[0]);launch(750,220,colors[1]);render();
let last=0;
function frame(now){if(playing&&now-last>=33){last=now;advance();render();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script></body></html>
