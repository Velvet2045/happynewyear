<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050916">
<title>Christmas Tree · Starlight Edition</title>
<meta name="description" content="A glowing Christmas tree woven from animated code and starlight.">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html{background:#050916}
body{margin:0;color:#e9eaf0;background:radial-gradient(ellipse at 50% 35%,#101d34 0%,#060b19 55%,#03050e 100%);font-family:system-ui,sans-serif}
.page{max-width:1060px;min-height:100svh;margin:auto;padding:18px clamp(12px,3vw,34px) 30px;display:flex;align-items:center;flex-direction:column}
nav{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;letter-spacing:.12em;font:11px ui-monospace,Consolas,monospace;color:#a4bbca}
a{color:#c7d8e4;text-decoration:none}a:hover{text-decoration:underline}
h1{font:400 clamp(30px,5vw,54px)/1.15 Georgia,serif;letter-spacing:-.03em;text-align:center;margin:20px 0 8px}
.subtitle{text-align:center;color:#a2b6c7;font:10px/1.8 ui-monospace,Consolas,monospace;letter-spacing:.17em;margin:0 0 16px}
.terminal{width:min(100%,770px);background:#040917;border:1px solid #324054;border-radius:12px;box-shadow:0 0 80px #33618d1c,0 28px 80px #000b;overflow:hidden}
.bar{height:35px;background:#101a2b;border-bottom:1px solid #263548;display:flex;align-items:center;gap:7px;padding:0 13px}
.dot{width:9px;height:9px;border-radius:50%;background:#d97878}.dot:nth-child(2){background:#d8b46c}.dot:nth-child(3){background:#8dc49e}
.filename{margin:auto;transform:translateX(-17px);color:#899bab;font:10px ui-monospace,Consolas,monospace}
.stage{position:relative;overflow:hidden;background:#030815}
canvas{display:block;width:100%;height:auto;aspect-ratio:9/10.2}
.hint{position:absolute;left:14px;bottom:11px;font:10px ui-monospace,Consolas,monospace;letter-spacing:.05em;color:#6d92a5;pointer-events:none}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
button{border:1px solid #637b93;background:#0b1624;color:#e8edf6;font:11px ui-monospace,Consolas,monospace;letter-spacing:.08em;padding:12px 17px;min-width:142px;cursor:pointer;border-radius:3px}
button:hover,button:focus-visible{background:#1c3349;border-color:#b6c6d6}
a:focus-visible,button:focus-visible{outline:2px solid #f5d98c;outline-offset:3px}
.message{text-align:center;color:#b9cad5;font-size:13px;line-height:1.9;word-break:keep-all}
footer{margin-top:auto;padding-top:20px;text-align:center;color:#7790a4;font:10px/2 ui-monospace,Consolas,monospace}
@media(max-width:520px){.page{padding:16px 8px 26px}nav{font-size:9px;letter-spacing:.04em}.hint{font-size:8px}}
@media(prefers-reduced-motion:reduce){canvas{scroll-behavior:auto}}
</style>
</head>
<body><div class="page">
<nav><a href="./?v=20261116-3">← CARD HOME</a><span><a href="./tree.html" aria-current="page">TREE</a> · <a href="./christmas.html?v=20261116-3">FIREWORKS ↗</a></span></nav>
<h1>A tree made of starlight ✧</h1>
<p class="subtitle">THOUSANDS OF LITTLE LIGHTS · ONE CHRISTMAS WISH</p>
<section class="terminal" aria-label="빛나는 문자로 이루어진 크리스마스 트리 애니메이션">
<div class="bar" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="filename">christmas_tree.js</span></div>
<div class="stage"><canvas id="sky" width="900" height="1020" role="img" aria-label="반짝이는 황금빛 별과 형형색색 문자로 채워진 크리스마스 트리, 눈 내리는 밤하늘"></canvas><span class="hint">✧ MADE WITH CODE & LIGHT</span></div>
</section>
<div class="actions"><button id="sparkle" type="button">✦ MORE SPARKLE</button><button id="pause" type="button">Ⅱ PAUSE</button></div>
<p class="message">작은 빛들이 모여 커다란 트리를 이루듯,<br>당신의 하루에도 반짝이는 순간들이 쌓이길. 🎄</p>
<footer>AN ORIGINAL ASCII-INSPIRED CHRISTMAS ANIMATION · 2026</footer>
</div>
<script>
(function(){
"use strict";
const canvas=document.getElementById("sky"),ctx=canvas.getContext("2d",{alpha:false});
const W=900,H=1020,CX=W/2,top=190,base=855,rows=55;
const palette=["#67bd9c","#79d9c2","#f6db7b","#e78f9b","#dc6a99","#bba2eb","#82bed9","#e9a66b","#c9ebdb"];
const glyphs="01<>/\\*+=:-{}[]$%&@#.;";
const rng=(a,b)=>a+Math.random()*(b-a);
const stars=Array.from({length:175},()=>({x:rng(0,W),y:rng(0,H),r:rng(.6,2.2),phase:rng(0,7)}));
const flakes=Array.from({length:115},()=>({x:rng(0,W),y:rng(0,H),r:rng(.7,2.4),speed:rng(.2,.9),drift:rng(0,7)}));
const symbols=[];
for(let row=0;row<rows;row++){
  const p=row/(rows-1),y=top+row*(base-top)/(rows-1);
  const radius=7+330*Math.pow(p,.89);
  const spacing=11.2;
  for(let x=-radius;x<=radius;x+=spacing){
    if(Math.random()<.06)continue;
    const depth=Math.sqrt(Math.max(0,1-(x/radius)**2));
    const shade=depth*.42+.58;
    symbols.push({x:CX+x+rng(-3,3),y:y+rng(-4,4),char:glyphs[Math.floor(rng(0,glyphs.length))],
      color:palette[Math.floor(rng(0,palette.length))],phase:rng(0,6.28),shade:shade,
      ornament:Math.random()<.085,tw:rng(.06,.18)});
  }
}
let tick=0,boost=0,playing=!window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function glow(x,y,r,c,alpha){
  ctx.globalAlpha=alpha;
  let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,"transparent");
  ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1;
}
function render(){
  ctx.fillStyle="#030713";ctx.fillRect(0,0,W,H);
  let bg=ctx.createRadialGradient(CX,480,60,CX,480,700);
  bg.addColorStop(0,"#122039");bg.addColorStop(.52,"#070e20");bg.addColorStop(1,"#030713");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{
    const a=.25+.5*(.5+.5*Math.sin(tick*.015+s.phase));
    ctx.fillStyle="rgba(198,221,249,"+a+")";
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
  // Soft halo behind the foliage, not a solid geometric triangle.
  glow(CX,655,420,"#287c71",.12);
  glow(CX,590,290,"#416da0",.12);
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="12px Consolas,monospace";
  symbols.forEach(s=>{
    const pulse=.56+.44*Math.sin(tick*s.tw+s.phase);
    const lit=s.ornament && (pulse>.59||boost>0);
    const intensity=(.35+.54*pulse)*s.shade;
    if(lit)glow(s.x,s.y,20,s.color,.16+.15*pulse);
    ctx.globalAlpha=lit?1:intensity;
    ctx.fillStyle=s.color;
    ctx.fillText(lit?"✦":s.char,s.x,s.y);
  });
  ctx.globalAlpha=1;
  // Subtle wraps of metallic garland add depth without losing the code texture.
  for(let band=0;band<7;band++){
    const y=300+band*76;
    const p=(y-top)/(base-top),width=(7+330*Math.pow(p,.89))*.92;
    ctx.strokeStyle="rgba(252,223,148,"+(.055+.027*Math.sin(tick*.03+band))+")";
    ctx.lineWidth=1.3;ctx.beginPath();
    for(let x=-width;x<=width;x+=4){
      const yy=y+17*Math.sin((x/width)*Math.PI*1.7+band*.9);
      if(x===-width)ctx.moveTo(CX+x,yy);else ctx.lineTo(CX+x,yy);
    }
    ctx.stroke();
  }
  // Brilliant star topper with a bloom and sparkling star points.
  const shine=.8+.2*Math.sin(tick*.055);
  glow(CX,149,120,"#ffda78",.52*shine);
  glow(CX,149,64,"#fff4c4",.63*shine);
  ctx.save();ctx.translate(CX,149);
  ctx.shadowColor="#ffe7a0";ctx.shadowBlur=33;
  ctx.fillStyle="#fff2b3";
  const points=10,outer=36+3*Math.sin(tick*.03),inner=14;
  ctx.beginPath();
  for(let i=0;i<points;i++){
    const a=i*Math.PI/5-Math.PI/2,r=i%2?inner:outer;
    if(!i)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
    else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
  }
  ctx.closePath();ctx.fill();ctx.restore();
  // Cascading dots of golden light above and around the star.
  for(let i=0;i<30;i++){
    const a=i*2.39996+tick*.012,d=23+(i*13)%105;
    const x=CX+Math.cos(a)*d*.53,y=149+Math.sin(a)*d*.61;
    glow(x,y,6,i%3?"#ffe4a3":"#fffef0",.26+.2*Math.sin(tick*.05+i));
  }
  // Falling snow lives in the foreground too.
  flakes.forEach(s=>{
    const a=.3+.5*(.5+.5*Math.sin(tick*.02+s.drift));
    ctx.fillStyle="rgba(209,228,246,"+a+")";
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
  glow(CX,884,300,"#619eb5",.13);
  ctx.fillStyle="#0c1524";ctx.fillRect(0,940,W,80);
  ctx.fillStyle="#a8bacb";ctx.globalAlpha=.68;ctx.font="12px Consolas,monospace";ctx.textAlign="left";
  ctx.fillText("christmas_tree.js  ·  running",24,981);
  ctx.textAlign="right";ctx.fillStyle="#9bc9b9";ctx.fillText(playing?"● 30 fps":"Ⅱ paused",W-24,981);
  ctx.globalAlpha=1;
}
function advance(){
 tick++;
 if(boost>0)boost--;
 for(const s of flakes){s.y+=s.speed;s.x+=Math.sin(tick*.012+s.drift)*.26;if(s.y>H){s.y=0;s.x=rng(0,W);}if(s.x>W)s.x=0;if(s.x<0)s.x=W;}
}
document.getElementById("sparkle").addEventListener("click",()=>{boost=95;for(let i=0;i<30;i++){const s=symbols[Math.floor(rng(0,symbols.length))];s.phase=rng(0,6.28);s.ornament=true;}render();});
const pause=document.getElementById("pause");
pause.addEventListener("click",()=>{playing=!playing;pause.textContent=playing?"Ⅱ PAUSE":"▶ PLAY";render();});
if(!playing)pause.textContent="▶ PLAY";
render();
let last=0;
function frame(now){if(playing&&now-last>=33){last=now;advance();render();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body></html>
